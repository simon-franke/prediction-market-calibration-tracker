name: prediction-market-calibration-tracker

x-app-environment: &app-environment
  DATABASE_URL: >-
    postgresql+asyncpg://${POSTGRES_USER:-calibration}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-calibration_tracker}

services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calibration_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-calibration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  bootstrap:
    build: .
    command: ["calibration-bootstrap"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["calibration-worker"]
    environment: *app-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    command:
      ["calibration-dashboard", "--server.address=0.0.0.0", "--server.port=8501"]
    environment: *app-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    restart: unless-stopped

  api:
    build: .
    command:
      ["uvicorn", "prediction_market_tracker.api:app", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
