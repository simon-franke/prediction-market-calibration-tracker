[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-market-calibration-tracker"
version = "0.1.0"
description = "Provider-neutral prediction-market calibration tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "plotly>=5.24,<7.0",
  "psycopg[binary]>=3.2,<4.0",
  "asyncpg>=0.29,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.39,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
calibration-tracker = "prediction_market_tracker.main:main"
calibration-bootstrap = "prediction_market_tracker.bootstrap:main"
calibration-worker = "prediction_market_tracker.worker:main"
calibration-dashboard = "prediction_market_tracker.dashboard.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_market_tracker"]
